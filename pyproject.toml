[project]
name = "witness"
version = "0.1.0"
description = "An AI code reviewer that only reports bugs it can prove by executing a reproducing test."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "anthropic>=0.70",
    "openai>=1.40",
    "docker>=7.1",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "rich>=13.9",
    "tree-sitter>=0.25",
    "tree-sitter-language-pack>=0.9",
]

[project.optional-dependencies]
tracing = ["tracewright"]

[project.scripts]
witness = "witness.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
    "types-docker>=7.1",
]

[tool.uv.sources]
tracewright = { path = "../agent-flight-recorder/sdk/python", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/witness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: needs a running Docker daemon (deselect with -m 'not integration')"]

[tool.ruff]
line-length = 100
target-version = "py313"
# The demo project is fixture data with its own conventions.
extend-exclude = ["fixtures/demo-repo/base", "fixtures/demo-repo/head"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PT", "RET"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["tree_sitter_language_pack.*", "tracewright.*"]
ignore_missing_imports = true
